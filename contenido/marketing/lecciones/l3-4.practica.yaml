preguntas:
  - tema: Buyer persona
    dif: 1
    enunciado: El buyer persona es…
    opciones:
      - [Un cliente real elegido al azar, Es semi-ficticio y construido con investigación.]
      - [Una representación semi-ficticia de un cliente potencial, Correcto.]
      - [Una etapa del embudo, No.]
      - [Un tipo de anuncio, No.]
    correcta: 1
    o: c 4 | 80
  - tema: Journey
    dif: 2
    enunciado: "Identificar en qué puntos el cliente se siente perdido o enojado y crear métricas para esos momentos corresponde al paso del journey map llamado:"
    opciones:
      - [Objetivos, Es definir para qué se mapea.]
      - [Momentos clave, Correcto.]
      - [Etapas del trayecto, Son las fases a analizar.]
      - [Identificar al cliente, Es el perfil.]
    correcta: 1
    o: c 3 | 62
  - tema: Embudo
    dif: 2
    enunciado: "Un lead que se suscribió al newsletter está, en el ejemplo de Carlos, en la fase:"
    opciones:
      - [Desconocido, No conoce la marca aún.]
      - [Suscriptor o lead, Correcto.]
      - [Oportunidad, Es cuando prueba el producto.]
      - [Cliente de pago, Es cuando compra.]
    correcta: 1
    o: c 3 | 65-66
  - tema: Inbound/outbound
    dif: 2
    enunciado: "Una empresa publica guías útiles y casos para que los interesados la encuentren y luego la contacten. Es:"
    opciones:
      - [Outbound, Sería buscar al cliente con foco en el producto.]
      - [Inbound, "Correcto: atrae mediante contenido de valor."]
      - [Venta por insistencia, Es outbound.]
      - [Marketing 1.0, No describe esta práctica.]
    correcta: 1
    o: c 3 | 61
  - tema: Journey
    dif: 3
    enunciado: "Elegí un negocio y completá tres de los siete pasos de un journey map para un segmento (objetivo, etapas, punto de contacto), señalando un punto de dolor."
    modelo: "Ej. panadería: objetivo: mejorar la experiencia de pedido; etapas: primer contacto (Instagram), orientación (ver precios), interacción (pedido), retención, expansión; punto de dolor: pedidos por WhatsApp con demoras. Mejora: catálogo con carrito."
    criterios:
      - Define un objetivo de mapeo
      - Describe etapas y puntos de contacto
      - Identifica un punto de dolor y una mejora
    o: c 3 | 61-63
tarjetas:
  - [Cuatro pasos para construir un buyer persona, "Investigar, definir, darle vida (nombre, foto, historia) y actualizar periódicamente."]
  - [Siete pasos del journey map, Objetivos · identificar al cliente · etapas · necesidades y actividades · puntos de contacto · momentos clave · sensaciones.]
  - [Embudo de conversión, Reducción progresiva de clientes potenciales hasta la conversión.]
  - [Inbound vs. outbound, "Inbound: atrae con contenido de valor, comunicación bilateral. Outbound: la empresa busca al cliente, foco en el producto, venta por insistencia."]
  - [Fases del lead en el ejemplo, Desconocido → suscriptor/lead → lead calificado → oportunidad → cliente de pago.]
