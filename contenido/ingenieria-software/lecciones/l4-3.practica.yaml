preguntas:
  - tema: Despliegue
    dif: 1
    enunciado: "¿Qué es esencial tener antes de desplegar a producción?"
    opciones:
      - ["Un plan de rollback probado", "Correcto."]
      - ["Solo el código compilado", "Insuficiente."]
      - ["Solo la base de datos", "Insuficiente."]
      - ["Nada", "Incorrecto."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Mantenimiento
    dif: 1
    enunciado: "¿Qué tipo de mantenimiento corrige defectos detectados?"
    opciones:
      - ["Correctivo", "Correcto."]
      - ["Adaptativo", "Ese adapta al entorno."]
      - ["Perfectivo", "Ese mejora."]
      - ["Preventivo", "Ese previene."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Mantenimiento
    dif: 2
    enunciado: "¿Qué tipo de mantenimiento adapta el software a un nuevo SO o regulación?"
    opciones:
      - ["Adaptativo", "Correcto."]
      - ["Correctivo", "Ese corrige bugs."]
      - ["Perfectivo", "Ese mejora."]
      - ["Preventivo", "Ese previene."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Modelos
    dif: 2
    enunciado: "¿Cuándo conviene usar el modelo en cascada?"
    opciones:
      - ["Cuando los requisitos son estables, conocidos y regulados", "Correcto."]
      - ["Cuando los requisitos cambian mucho", "No: ahí es mejor ágil."]
      - ["Cuando hay mucho riesgo", "Mejor espiral."]
      - ["Cuando el equipo es inexperto", "No necesariamente."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Modelos
    dif: 3
    enunciado: "Explicá con tus palabras cuándo elegir modelo ágil vs. cascada."
    modelo: "Cascada para requisitos estables, regulados, predecibles. Ágil para requisitos cambiantes, incertidumbre alta, necesidad de feedback rápido y entrega incremental de valor."
    criterios:
      - "Menciona requisitos estables para cascada"
      - "Menciona requisitos cambiantes/incertidumbre para ágil"
      - "Menciona entrega incremental vs. entrega única"
tarjetas:
  - ["¿Qué es mantenimiento correctivo?", "Corrección de defectos/bugs detectados."]
  - ["¿Qué es mantenimiento adaptativo?", "Adaptación a cambios de entorno (SO, HW, leyes)."]
  - ["¿Cuándo usar cascada?", "Requisitos estables, conocidos, regulados."]
  - ["¿Cuándo usar ágil?", "Requisitos cambiantes, incertidumbre, feedback rápido."]