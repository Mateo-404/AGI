preguntas:
  - tema: Clean Code
    dif: 1
    enunciado: "¿Qué principio dice \"no te repitas\"?"
    opciones:
      - ["DRY (Don't Repeat Yourself)", "Correcto."]
      - ["KISS", "Ese es Keep It Simple."]
      - ["YAGNI", "Ese es You Aren't Gonna Need It."]
      - ["SOLID", "Es un acrónimo de 5 principios."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Clean Code
    dif: 2
    enunciado: "¿Qué significa YAGNI?"
    opciones:
      - ["You Aren't Gonna Need It: no implementes \"por si acaso\"", "Correcto."]
      - ["You Are Gonna Need It", "Es lo opuesto."]
      - ["Your API Grows Nicely", "No."]
      - ["Yet Another Great New Idea", "No."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Revisión
    dif: 1
    enunciado: "¿Cuándo se debe hacer la revisión de código?"
    opciones:
      - ["Antes de mergear a main", "Correcto."]
      - ["Después del deploy", "Demasiado tarde."]
      - ["Solo al final del sprint", "Tarde."]
      - ["Nunca", "Incorrecto."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: IDEs
    dif: 2
    enunciado: "¿Qué factores influyen en la elección de un IDE?"
    opciones:
      - ["Lenguaje, ecosistema, plugins, equipo", "Correcto."]
      - ["Solo el precio", "No."]
      - ["Solo el color del tema", "No."]
      - ["El nombre", "No."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Clean Code
    dif: 3
    enunciado: "Explicá con tus palabras la diferencia entre DRY, KISS y YAGNI."
    modelo: "DRY = no duplicar código (abstraer); KISS = mantenerlo simple, evitar complejidad innecesaria; YAGNI = no implementar funcionalidades \"por si acaso\" que no se necesitan hoy."
    criterios:
      - "Define DRY (no duplicar)"
      - "Define KISS (simple)"
      - "Define YAGNI (no anticipar)"
tarjetas:
  - ["¿Qué es DRY?", "Don't Repeat Yourself: no duplicar código, abstraer."]
  - ["¿Qué es KISS?", "Keep It Simple, Stupid: evitar complejidad innecesaria."]
  - ["¿Qué es YAGNI?", "You Aren't Gonna Need It: no implementar 'por si acaso'."]