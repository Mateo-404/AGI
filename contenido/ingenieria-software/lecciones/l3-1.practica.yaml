preguntas:
  - tema: Arquitectura
    dif: 1
    enunciado: "¿Qué define la arquitectura de software?"
    opciones:
      - ["Estructura global: componentes, conectores, estilos, patrones", "Correcto."]
      - ["Solo el código fuente", "No: eso es diseño detallado."]
      - ["Solo la base de datos", "No."]
      - ["Solo la interfaz", "No."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 3"
  - tema: Microservicios
    dif: 2
    enunciado: "¿Cuándo conviene usar arquitectura de microservicios?"
    opciones:
      - ["Sistemas grandes, equipos autónomos, necesidad de escalabilidad independiente", "Correcto."]
      - ["Proyectos pequeños", "No: overhead innecesario."]
      - ["Apps monolíticas simples", "No."]
      - ["Solo apps móviles", "No."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 3"
  - tema: UML
    dif: 1
    enunciado: "¿Qué muestra un diagrama de clases?"
    opciones:
      - ["Estructura estática: clases, atributos, métodos, relaciones", "Correcto."]
      - ["Flujo de datos", "Eso es DFD."]
      - ["Secuencia temporal", "Eso es secuencia."]
      - ["Estados", "Eso es estado."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 3"
  - tema: Paradigmas
    dif: 2
    enunciado: "¿Qué paradigma se basa en funciones puras e inmutabilidad?"
    opciones:
      - ["Funcional", "Correcto."]
      - ["Imperativo", "Ese usa estado mutable."]
      - ["Orientado a objetos", "Ese usa objetos con estado."]
      - ["Lógico", "Ese usa hechos y reglas."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 3"
  - tema: Arquitectura
    dif: 3
    enunciado: "Explicá con tus palabras la diferencia entre arquitectura hexagonal y microservicios."
    modelo: "La arquitectura hexagonal aísla el núcleo de dominio con puertos y adaptadores para testabilidad; los microservicios son servicios independientes desplegables por red. Hexagonal es intra-proceso; micro es inter-proceso."
    criterios:
      - "Diferencia intra vs inter-proceso"
      - "Menciona puertos/adaptadores vs servicios independientes"
      - "Menciona testabilidad vs despliegue independiente"
tarjetas:
  - ["¿Qué es una arquitectura?", "Estructura global: componentes, conectores, estilos, decisiones transversales."]
  - ["¿Qué es un microservicio?", "Servicio pequeño, independiente, autónomo, desplegable independientemente."]
  - ["¿Qué es UML?", "Lenguaje estándar para visualizar, especificar y documentar sistemas."]