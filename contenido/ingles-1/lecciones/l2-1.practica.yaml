preguntas:
  - tema: Presente continuo
    dif: 1
    enunciado: ¿Para qué se usa el presente continuo?
    opciones:
      - [Para acciones en progreso en el momento de hablar, "Correcto."]
      - [Para rutinas y hábitos, "Eso es presente simple."]
      - [Para verdades permanentes, "Eso es presente simple."]
      - [ Para el pasado, "No."]
    correcta: 0
    o: a Apuntes de Inglés I · Tema 3
  - tema: Estructura
    dif: 1
    enunciado: ¿Cuál es la estructura afirmativa del presente continuo?
    opciones:
      - [Subject + to be + verb-ing, "Correcto."]
      - [Subject + verbo base, "Eso es presente simple."]
      - [To be + subject + verb-ing, "Ese es el orden interrogativo."]
      - [ Subject + not + verb-ing, "Ese es el orden negativo."]
    correcta: 0
    o: a Apuntes de Inglés I · Tema 3
  - tema: -ing
    dif: 2
    enunciado: ¿Qué ocurre con los verbos terminados en -e al agregar -ing?
    opciones:
      - [Se suprime la e y se agrega -ing, "Correcto: believe → believing."]
      - [Se duplica la última consonante, "Eso es para verbos CVC."]
      - [ No se modifica, "No: se suprime la e."]
      - [ Se agrega -es, "No."]
    correcta: 0
    o: a Apuntes de Inglés I · Tema 3
  - tema: CVC
    dif: 2
    enunciado: ¿Cuándo se duplica la última consonante al agregar -ing?
    opciones:
      - [En verbos monosilábicos CVC, "Correcto: jog → jogging."]
      - [En todos los verbos, "No: solo en CVC."]
      - [ Nunca, "Sí se duplica en CVC."]
      - [ Solo en verbos largos, "No."]
    correcta: 0
    o: a Apuntes de Inglés I · Tema 3
  - tema: Diferencia
    dif: 3
    enunciado: Explicá con tus palabras la diferencia entre presente simple y presente continuo.
    modelo: El presente simple se usa para rutinas, hábitos y verdades generales; el presente continuo para acciones en progreso en el momento de hablar.
    criterios:
      - Menciona el uso del presente simple
      - Menciona el uso del presente continuo
tarjetas:
  - [¿Cuál es la estructura del presente continuo?, "Subject + to be + verb-ing."]
  - [Regla de -ing para verbos en -e, "Se suprime la e: believe → believing."]
  - [Regla CVC, "Se duplica la última consonante: jog → jogging."]
