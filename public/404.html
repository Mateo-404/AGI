<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Somos #AGI · Redirigiendo</title>
    <!-- GitHub Pages no sirve rutas que no son archivos: esta página convierte /AGI/marketing en /AGI/#/marketing. -->
    <script>
      (function () {
        var base = '/AGI/';
        var ruta = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length) : location.pathname.replace(/^\//, '');
        location.replace(base + '#/' + ruta.replace(/\/$/, '') + location.search + location.hash);
      })();
    </script>
    <noscript><p>Abrí <a href="/AGI/#/marketing">Marketing Digital</a>.</p></noscript>
  </head>
  <body></body>
</html>
