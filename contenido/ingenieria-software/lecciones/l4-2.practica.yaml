preguntas:
  - tema: Verificación
    dif: 1
    enunciado: "¿Qué es la verificación en pruebas de software?"
    opciones:
      - ["Comprobar que construimos el producto correctamente (cumple el diseño)", "Correcto."]
      - ["Comprobar que construimos el producto correcto (satisface la necesidad)", "Eso es validación."]
      - ["Comprobar el hardware", "No."]
      - ["Comprobar el presupuesto", "No."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Validación
    dif: 1
    enunciado: "¿Qué es la validación en pruebas de software?"
    opciones:
      - ["Comprobar que construimos el producto correcto (satisface la necesidad del usuario)", "Correcto."]
      - ["Comprobar que construimos el producto correctamente", "Eso es verificación."]
      - ["Comprobar el código fuente", "No."]
      - ["Comprobar la documentación", "No."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Niveles
    dif: 2
    enunciado: "¿Cuáles son los niveles de prueba?"
    opciones:
      - ["Unidad, integración, sistema, aceptación", "Correcto."]
      - ["Solo unidad", "Faltan los demás."]
      - ["Solo integración", "Faltan los demás."]
      - ["Solo aceptación", "Faltan los demás."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Cajas
    dif: 2
    enunciado: "¿Qué es la prueba de caja negra?"
    opciones:
      - ["El componente se trata como una caja opaca, sin conocer su estructura interna", "Correcto."]
      - ["Visibilidad total del código", "Eso es caja blanca."]
      - ["Enfoque híbrido", "Eso es caja gris."]
      - ["Prueba de rendimiento", "No."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Valores límite
    dif: 2
    enunciado: "¿Por qué se concentran los tests en los valores límite?"
    opciones:
      - ["La mayoría de errores de programación se concentra en los bordes de las condiciones", "Correcto."]
      - ["Son los valores más fáciles de probar", "No necesariamente."]
      - ["Son los únicos valores válidos", "No."]
      - ["El cliente lo pide", "No."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 4"
  - tema: Partición equivalencia
    dif: 3
    enunciado: "Explicá con tus palabras qué es la partición de equivalencia y da un ejemplo."
    modelo: "La partición de equivalencia agrupa entradas que se espera produzcan el mismo comportamiento; se prueba un valor por grupo. Ejemplo: edad 1-120 válido → particiones: <1, 1-120, >120; casos: 0, 25, 150."
    criterios:
      - "Menciona la agrupación de entradas con mismo comportamiento"
      - "Menciona la partición de equivalencia"
      - "Menciona la prueba de un valor por grupo"
      - "Da un ejemplo"
tarjetas:
  - ["¿Qué es la verificación?", "Comprobar que construimos el producto correctamente."]
  - ["¿Qué es la validación?", "Comprobar que construimos el producto correcto."]
  - ["Niveles de prueba", "Unidad, integración, sistema, aceptación."]