preguntas:
- correcta: 0
  dif: 1
  enunciado: 'Qué es el ciclo de vida del software?'
  o: a Apuntes de Ingeniería de Software · Unidad 2
  opciones:
  - - 'El conjunto de fases que atraviesa el software desde su concepción hasta su retiro'
    - 'Correcto.'
  - - 'El tiempo que tarda en codificarse un programa'
    - 'No: el ciclo de vida es mucho más que la codificación.'
  - - 'El presupuesto de un proyecto de software'
    - 'No.'
  - - 'La licencia bajo la que se distribuye el software'
    - 'No.'
  tema: Ciclo de vida
- correcta: 0
  dif: 2
  enunciado: 'Qué es el Fuzzy Front End de la planificación?'
  o: a Apuntes de Ingeniería de Software · Unidad 2
  opciones:
  - - 'La fase inicial donde la incertidumbre es máxima y se definen objetivos y alcance'
    - 'Correcto: es el "frente difuso" antes de comprometer recursos significativos.'
  - - 'La última fase del ciclo de vida'
    - 'No: es la primera.'
  - - 'Una técnica de testing exploratorio'
    - 'No.'
  - - 'El panel de control del servidor de producción'
    - 'No.'
  tema: Planificación
- correcta: 0
  dif: 2
  enunciado: 'Qué tipo de viabilidad evalúa el ROI, el NPV y el payback?'
  o: a Apuntes de Ingeniería de Software · Unidad 2
  opciones:
  - - 'La viabilidad económica'
    - 'Correcto: compara costos contra beneficios.'
  - - 'La viabilidad técnica'
    - 'No: esa evalúa si la tecnología y las competencias existen.'
  - - 'La viabilidad operacional'
    - 'No: esa evalúa si la organización puede usar el sistema.'
  tema: Estudio de viabilidad
- correcta: 0
  dif: 2
  enunciado: 'Qué pregunta responde la viabilidad operacional?'
  o: a Apuntes de Ingeniería de Software · Unidad 2
  opciones:
  - - '¿La organización podrá usar el sistema? ¿La gente lo usará?'
    - 'Correcto: considera cambios culturales, entrenamiento y procesos.'
  - - '¿Existe la tecnología para construirlo?'
    - 'No: esa es la viabilidad técnica.'
  - - '¿El proyecto es rentable?'
    - 'No: esa es la viabilidad económica.'
  tema: Estudio de viabilidad
- correcta: 0
  dif: 2
  enunciado: 'Con qué fase comienza el ciclo de vida del software?'
  o: a Apuntes de Ingeniería de Software · Unidad 2
  opciones:
  - - 'La concepción (idea, necesidad)'
    - 'Correcto: de ahí salen planificación, requerimientos, diseño, etc.'
  - - 'El diseño'
    - 'No: llega después de los requerimientos.'
  - - 'La codificación'
    - 'No: es la fase 5.'
  - - 'El mantenimiento'
    - 'No: es casi la última.'
  tema: Ciclo de vida
- dif: 3
  enunciado: 'Por qué se llama Fuzzy Front End a la planificación inicial?'
  o: a Apuntes de Ingeniería de Software · Unidad 2
  modelo: 'Porque es la zona nebulosa inicial del proyecto, donde la incertidumbre es máxima y las decisiones tomadas tienen el mayor impacto.'
  criterios:
  - 'Menciona la alta incertidumbre inicial'
  - 'Menciona que las decisiones de esa fase tienen gran impacto'
  tema: Planificación
tarjetas:
- - 'Qué es el ciclo de vida del software?'
  - 'El conjunto de fases que atraviesa el software desde su concepción hasta su retiro.'
- - 'Cuáles son los tres tipos de estudio de viabilidad?'
  - 'Técnica (¿se puede construir?), económica (¿conviene?) y operacional (¿se usará?).'
- - 'Qué es el Fuzzy Front End?'
  - 'La fase inicial del proyecto donde la incertidumbre es máxima y las decisiones tienen mayor impacto.'
