preguntas:
  - tema: Kanban
    dif: 1
    enunciado: "¿Qué es un tablero Kanban?"
    opciones:
      - ["Una representación visual del flujo de trabajo con columnas y tarjetas", "Correcto."]
      - ["Una lista de tareas en Excel", "No."]
      - ["Un diagrama de Gantt", "No."]
      - ["Un diagrama de clases", "No."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 5"
  - tema: WIP
    dif: 2
    enunciado: "¿Por qué son importantes los límites WIP en Kanban?"
    opciones:
      - ["Reducen el tiempo de ciclo, evitan multitarea y exponen cuellos de botella", "Correcto."]
      - ["Aumentan la velocidad", "Paradójicamente, reducen WIP reduce cycle time."]
      - ["Obligan a trabajar más", "No."]
      - ["Son obligatorios por ley", "No."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 5"
  - tema: JIRA
    dif: 1
    enunciado: "¿Qué es un \"Epic\" en JIRA?"
    opciones:
      - ["Un gran cuerpo de trabajo que se descompone en Stories/Tasks", "Correcto."]
      - ["Un tipo de bug crítico", "No."]
      - ["Un sprint muy largo", "No."]
      - ["Un tipo de usuario administrador", "No."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 5"
  - tema: "Scrum vs Kanban"
    dif: 2
    enunciado: "¿Cuál es una diferencia clave entre Scrum y Kanban?"
    opciones:
      - ["Scrum usa sprints fijos; Kanban es flujo continuo sin sprints", "Correcto."]
      - ["Son iguales", "No."]
      - ["Kanban tiene roles definidos; Scrum no", "Es al revés."]
      - ["Scrum no tiene WIP limits; Kanban sí", "Kanban los requiere, Scrum no obligatoriamente."]
    correcta: 0
    o: "a Apuntes de Ingeniería de Software · Unidad 5"
  - tema: Scrumban
    dif: 3
    enunciado: "Explicá con tus palabras qué es Scrumban y cuándo usarlo."
    modelo: "Scrumban es un híbrido que combina la estructura de Scrum (roles, eventos opcionales) con la fluidez de Kanban (WIP limits, flujo continuo). Ideal para equipos en transición de Scrum a Kanban o que necesitan flexibilidad."
    criterios:
      - "Menciona híbrido Scrum + Kanban"
      - "Menciona WIP limits y flujo continuo"
      - "Menciona cuándo usarlo (transición, equipos mixtos)"
tarjetas:
  - ["¿Qué es Kanban?", "Gestión visual del flujo con WIP limits."]
  - ["¿Qué es WIP limit?", "Límite de ítems en progreso; reduce cycle time."]
  - ["Scrum vs Kanban", "Sprints fijos vs flujo continuo; roles definidos vs flexibles."]