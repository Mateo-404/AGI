preguntas:
  - tema: Ciclo de vida
    dif: 1
    enunciado: ¿Qué es el ciclo de vida del software?
    opciones:
      - [El conjunto de fases que atraviesa el software desde su concepción hasta su retiro, "Correcto."]
      - [Solo la fase de programación, "Faltan las demás."]
      - [ Solo la fase de pruebas, "Faltan las demás."]
      - [ Solo la fase de despliegue, "Faltan las demás."]
    correcta: 0
    o: a Apuntes de Ingeniería de Software · Unidad 2
  - tema: Viabilidad
    dif: 2
    enunciado: ¿Qué evalúa el estudio de viabilidad?
    opciones:
      - ["La viabilidad técnica, económica y operacional del proyecto", "Correcto."]
      - [ Solo el diseño, "Faltan las demás dimensiones."]
      - [ Solo el código, "No."]
      - [ Solo el presupuesto, "Falta la técnica y la operacional."]
    correcta: 0
    o: a Apuntes de Ingeniería de Software · Unidad 2
  - tema: Planificación
    dif: 1
    enunciado: ¿Qué se define en la planificación (fuzzy front end)?
    opciones:
      - [Los objetivos y el alcance del proyecto, "Correcto."]
      - [ El código fuente, "No."]
      - [ Las pruebas, "No."]
      - [ El despliegue, "No."]
    correcta: 0
    o: a Apuntes de Ingeniería de Software · Unidad 2
  - tema: Análisis
    dif: 2
    enunciado: ¿Qué se identifica en la fase de análisis?
    opciones:
      - [Los requerimientos del sistema, "Correcto."]
      - [ El hardware, "No."]
      - [ El lenguaje de programación, "No."]
      - [ El sistema operativo, "No."]
    correcta: 0
    o: a Apuntes de Ingeniería de Software · Unidad 2
tarjetas:
  - [¿Qué es el ciclo de vida del software?, "Fases desde la concepción hasta el retiro."]
  - [¿Qué evalúa la viabilidad?, "Técnica, económica y operacional."]
  - [¿Qué se define en la planificación?, "Objetivos y alcance."]
