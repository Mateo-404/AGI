    correcta: 0
    o: a Apuntes de Inglés I · Tema 8
tarjetas:
  - [¿En qué categorías se organiza el vocabulario?, "Rutina, trabajo, emociones, conversación y verbos."]
  - [¿Dónde están los listados detallados?, "En el material de estudio (RemNote)."]
  - [Ejemplo de chunk saludo, "How's it going? / What's up?"]
  - [Ejemplo de chunk despedida, "See you later / Take care."]
  - [Verbos top 5, "do, make, get, take, go."]
  - [Emoción positiva, "happy, excited, proud, grateful."]
