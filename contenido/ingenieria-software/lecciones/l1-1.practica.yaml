preguntas:
  - tema: Sistema
    dif: 1
    enunciado: ¿Qué es un sistema?
    opciones:
      - [Un conjunto de elementos interrelacionados que forman un todo con un propósito, "Correcto."]
      - [Un solo elemento aislado, "No."]
      - [ Un programa, "No necesariamente."]
      - [ Un hardware, "No."]
    correcta: 0
    o: a Apuntes de Ingeniería de Software · Unidad 1
  - tema: SI
    dif: 2
    enunciado: ¿En qué se diferencia un sistema de información de un sistema informático?
    opciones:
      - [El SI es más amplio; el sistema informático es solo una parte, "Correcto."]
      - [Son lo mismo, "No."]
      - [ El sistema informático es más amplio, "Es al revés."]
      - [ No hay diferencia, "Hay diferencia."]
    correcta: 0
    o: a Apuntes de Ingeniería de Software · Unidad 1
  - tema: IS
    dif: 1
    enunciado: ¿Qué es la Ingeniería de Software?
    opciones:
      - ["La aplicación de un enfoque sistemático, disciplinado y cuantificable al desarrollo de software", "Correcto."]
      - [La programación sin metodología, "No."]
      - [ El diseño de hardware, "No."]
      - [ La instalación de sistemas operativos, "No."]
    correcta: 0
    o: a Apuntes de Ingeniería de Software · Unidad 1
  - tema: Capas
    dif: 2
    enunciado: ¿Cuáles son las capas de la Ingeniería de Software?
    opciones:
      - ["Calidad, proceso, métodos y herramientas", "Correcto."]
      - [Solo código, "Faltan las demás."]
      - [ Solo diseño, "Faltan las demás."]
      - [ Solo pruebas, "Faltan las demás."]
    correcta: 0
    o: a Apuntes de Ingeniería de Software · Unidad 1
tarjetas:
  - [¿Qué es un sistema de información?, "Conjunto de elementos que recuperan y procesan información para una organización."]
  - [¿Cuáles son las capas de la IS?, "Calidad, proceso, métodos y herramientas."]
  - [¿Qué es la IS?, "Enfoque sistemático, disciplinado y cuantificable para el desarrollo de software."]
