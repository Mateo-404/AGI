preguntas:
  - tema: TP
    dif: 1
    enunciado: ¿Cuál es el tamaño de grupo que establece el Anexo 2 para el TP?
    opciones:
      - [1 o 2 integrantes, No es la consigna.]
      - [De 3 a 5 integrantes, "Correcto: «grupos de hasta 5 integrantes y mínimo 3»."]
      - [De 6 a 10, No.]
      - [Sin límite, Hay límites.]
    correcta: 1
    o: c Anexo 2 | 178
  - tema: TP
    dif: 2
    enunciado: En la Parte 8 del TP se debe…
    opciones:
      - [Escribir solo teoría, Se piden piezas.]
      - [Usar IA para producir al menos 3 piezas de contenido y aclarar la herramienta y cómo se usó, Correcto.]
      - [Comprar publicidad, No se pide.]
      - [Presentar un balance, No se pide.]
    correcta: 1
    o: c Anexo 2 | 177-178
  - tema: Integración
    dif: 3
    enunciado: Quien no cursó Marketing y comercialización debe…
    opciones:
      - [No hacer el TP, Debe hacerlo.]
      - [Usar un caso base (del cuaderno o del repositorio) para aplicar la escalabilidad digital, Correcto.]
      - [Elegir cualquier empresa sin diagnóstico, Se requiere un caso base.]
      - [Reemplazarlo por un examen, No se menciona.]
    correcta: 1
    o: c Anexo 2 | 178
  - tema: Integración
    dif: 3
    enunciado: "Armá un mini-plan de 5 líneas que vincule objetivo SMART, funnel y tres canales (SEO/SEM, redes y email) para una librería."
    modelo: "Objetivo: aumentar un 30 % las ventas online en 4 meses. Funnel: atraer (SEO/redes), captar leads (suscripción al newsletter), convertir (tienda y email). SEO: optimizar fichas; SEM: Shopping con feed; Redes: contenido y Ads geolocalizados; Email: secuencia de bienvenida y recordatorio de carrito. KPI: CTR, tasa de conversión y costo por conversión."
    criterios:
      - Objetivo SMART con KPI
      - Estrategia por etapa del funnel
      - Tres canales coherentes
    o: c Anexo 2 | 177
tarjetas:
  - [Escalabilidad digital (Anexo 2), "Partes 5 a 8: diagnóstico digital, plan (objetivos SMART, KPI, funnel, POEM), estrategias (redes, SEO/SEM, email) y piezas con IA."]
  - [Consideraciones del TP, "Grupos de 3 a 5, presentación oral y escrita de 15 minutos, copia por mail, aclarar herramientas de IA."]
