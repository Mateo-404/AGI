tarjetas:
- - ¿Qué es Ingeniería de Software?
  - Aplicación de un enfoque sistemático, disciplinado y cuantificable para el desarrollo,
    operación y mantenimiento del software.
- - ¿Para qué modelo se usa la cascada?
  - Para requisitos estables, conocidos y regulados.
- - ¿Para qué modelo se usa ágil?
  - Para requisitos cambiantes, incertidumbre alta y necesidad de feedback rápido.
