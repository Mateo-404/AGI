tarjetas:
- - Qué es la Ingeniería de Software?
  - Aplicación de un enfoque sistemático, disciplinado y cuantificable para el desarrollo,
    operación y mantenimiento del software.
- - Cuándo surgió el término "crisis del software"?
  - 1968, Conferencia de la OTAN en Garmisch.
- - Cuáles son las 4 capas de la IS?
  - Calidad → Proceso → Métodos → Herramientas.
- - Qué representa la capa de Calidad?
  - Base cultural de mejora continua.
