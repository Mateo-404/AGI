preguntas:
  - tema: Planificación
    dif: 1
    enunciado: ¿Por qué el cuaderno no analiza cada red social individualmente?
    opciones:
      - [Porque no son importantes, Lo son; lo que cambia es su permanencia.]
      - ["Porque las plataformas pueden desaparecer, transformarse o ser reemplazadas; lo estratégico es priorizar un conjunto", Correcto.]
      - [Porque son todas iguales, No se afirma.]
      - [Porque están prohibidas, No.]
    correcta: 1
    o: c 9 | 162
  - tema: Contenido
    dif: 2
    enunciado: La Etapa 1 del marketing de contenidos consiste en…
    opciones:
      - [Publicar el contenido, Es posterior.]
      - ["Conocer al público: intereses, dudas, necesidades y puntos de dolor", Correcto.]
      - [Fijar el presupuesto, No es la etapa 1.]
      - [Medir resultados, Es posterior.]
    correcta: 1
    o: c 9 | 164
  - tema: Modelos
    dif: 2
    enunciado: "Para redactar un email persuasivo de venta resulta más adecuado:"
    opciones:
      - [AIDA, "Correcto: para convencer o vender."]
      - [SCQA, Es para exponer con lógica.]
      - [Círculo de oro, Es para inspirar o alinear equipos.]
      - [Ninguno, Sí hay uno apropiado.]
    correcta: 0
    o: c 9 | 165
  - tema: Objetivos
    dif: 3
    enunciado: "Elegí el objetivo que respeta el patrón del cuaderno:"
    opciones:
      - [Mejorar el engagement, Falta medida y plazo.]
      - [Aumentar el alcance de las publicaciones en un 30 % en 4 meses, "Correcto: verbo + objeto + medida + plazo."]
      - [Ser reconocidos, Es difuso.]
      - [Subir más historias, No hay medida ni plazo.]
    correcta: 1
    o: c 9 | 164
  - tema: Contenido
    dif: 3
    enunciado: "Elegí un negocio, definí un objetivo con el patrón del cuaderno y proponé una pieza de contenido estructurada con un modelo (AIDA, SCQA o Círculo de oro)."
    modelo: "Ej.: «Aumentar un 40 % las consultas por Instagram en 3 meses». Pieza con AIDA: gancho llamativo, beneficio, prueba social y CTA para escribir por mensaje. Se justifica AIDA porque el fin es convencer."
    criterios:
      - "Objetivo con verbo, objeto, medida y plazo"
      - Pieza coherente con el modelo elegido
      - Justifica la elección del modelo
    o: c 9 | 164-166
tarjetas:
  - [Cinco aspectos para planificar redes, Estudiar cada red · conocer al público · analizar a la competencia · evaluar recursos internos · definir el contenido.]
  - [Tres etapas del marketing de contenidos, Conocer al público · definir objetivos · diseñar el contenido.]
  - [AIDA, "Attention, Interest, Desire, Action: para convencer o vender."]
  - [SCQA, "Situation, Complication, Question, Answer: para exponer con lógica."]
  - [Marketing de contenidos, Crear y distribuir contenido de manera estratégica para alcanzar los objetivos de la organización.]
